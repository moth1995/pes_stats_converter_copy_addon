---
name: CI and Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run linters
        uses: super-linter/super-linter@v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          DEFAULT_BRANCH: master

          VALIDATE_JAVASCRIPT_ES: true
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs

          VALIDATE_HTML: true
          VALIDATE_CSS: true
          VALIDATE_JSON: true
          VALIDATE_YAML: true

  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build-and-release:
    if: startsWith(github.ref, 'refs/tags/v')

    needs:
      - lint
      - check

    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      TAG_NAME: ${{ github.ref_name }}
      ARCHIVE_NAME: pes_stats_copy_addon-${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag belongs to master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master

      - name: Verify tag and manifest version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          with open("src/manifest.json", "r", encoding="utf-8") as f:
              manifest_version = json.load(f).get("version", "")

          tag = os.environ["TAG_NAME"]

          match = re.fullmatch(
              r"v(\d+\.\d+\.\d+)(?:-(alpha|beta|rc)(?:\.\d+)?)?",
              tag,
          )

          if not match:
              print(f"Invalid release tag: {tag}")
              sys.exit(1)

          tag_version = match.group(1)

          print(
              f"manifest: {manifest_version} | "
              f"tag: {tag} | version: {tag_version}"
          )

          if manifest_version != tag_version:
              print("Manifest version does not match tag version.")
              sys.exit(1)
          PY

      - name: Create ZIP
        run: |
          mkdir -p dist
          cd src
          zip -r "../dist/${ARCHIVE_NAME}.zip" .

      - name: Create SHA256 checksum
        run: |
          cd dist
          sha256sum "${ARCHIVE_NAME}.zip" \
            > "${ARCHIVE_NAME}.zip.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "PES Stats Converter Copy ${{ env.TAG_NAME }}"
          tag_name: ${{ env.TAG_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: >-
            ${{
              contains(env.TAG_NAME, '-rc') ||
              contains(env.TAG_NAME, '-beta') ||
              contains(env.TAG_NAME, '-alpha')
            }}
          files: |
            dist/${{ env.ARCHIVE_NAME }}.zip
            dist/${{ env.ARCHIVE_NAME }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
